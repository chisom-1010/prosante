name: Keep Supabase awake

# Supabase pauses free projects after 7 days without database activity.
# This pings a route that runs a tiny query, every 3 days.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/health
        run: curl --fail --silent --show-error --retry 3 --max-time 30 "https://prosantes.site/api/health"
